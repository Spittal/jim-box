[package]
name = "jim-box"
version = "1.0.0"
description = "rekordbox library management, with search that finds lossless copies of tracks for it"
edition = "2021"
rust-version = "1.91"

[lib]
name = "jim_box_lib"

[[bin]]
name = "jim-box"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "io-util"] }
# gzip: the metadata services answer in JSON by the hundred kilobytes.
reqwest = { version = "0.12", features = ["json", "gzip"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
keyring = "4"
lofty = "0.25"
# Shrinks artwork to thumbnails for the track list.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
deunicode = "1"
urlencoding = "2"
trash = "5"
# The Soulseek client. Young and fast-moving (a major version most months):
# pinned exactly, and only `src/soulseek` talks to it. Upgrade deliberately.
soulseek-rs-lib = "=20.0.0"
# rekordbox's library: the encrypted master.db and the in-memory index over
# it, from rbxport (GPL-2.0-or-later). Pinned; upgrade deliberately.
rbl-db = { git = "https://github.com/chrisle/rbxport", rev = "d0ff75b378ec85be891d9f3067ada1e82bad4cae" }
rbl-core = { git = "https://github.com/chrisle/rbxport", rev = "d0ff75b378ec85be891d9f3067ada1e82bad4cae" }
rbl-index = { git = "https://github.com/chrisle/rbxport", rev = "d0ff75b378ec85be891d9f3067ada1e82bad4cae" }
rbl-analysis = { git = "https://github.com/chrisle/rbxport", rev = "d0ff75b378ec85be891d9f3067ada1e82bad4cae" }
rbl-anlz = { git = "https://github.com/chrisle/rbxport", rev = "d0ff75b378ec85be891d9f3067ada1e82bad4cae" }
rbl-audio = { git = "https://github.com/chrisle/rbxport", rev = "d0ff75b378ec85be891d9f3067ada1e82bad4cae" }
# The Beat This! beat tracker: a second opinion on every grid, and the grid
# itself where the tempo moves.
beat-this = { path = "crates/beat-this" }

[target.'cfg(unix)'.dependencies]
# Raises the open file limit for Soulseek's peer connections.
libc = "0.2"

[dev-dependencies]
tempfile = "3"

# SQLCipher and its OpenSSL are too slow unoptimized, even in dev builds.
[profile.dev.package."*"]
opt-level = 2

# A neural network is unusable unoptimized: minutes a track.
[profile.dev.package.beat-this]
opt-level = 3

[profile.release]
# Thin LTO rather than full: full re-optimised every dependency on each build,
# which was most of CI's time, for little saved in the bundle.
lto = "thin"
# One unit: the analysis and beat-tracking loops are worth the slower build.
codegen-units = 1
strip = true
