# Tests and builds the app for macOS and Windows. The installers are unsigned;
# they're attached to each run as artifacts.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple silicon)
            os: macos-26
            target: aarch64-apple-darwin
            test: true
          - name: Windows (x64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            test: true
          # Cross-compiled on the x64 machine, so its tests can't run there.
          - name: Windows (ARM64)
            os: windows-latest
            target: aarch64-pc-windows-msvc
            test: false
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      # SQLCipher's OpenSSL is built from source, which needs a native Perl on
      # Windows (not the one that comes with Git).
      - name: Use Strawberry Perl for OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $perl = "C:\Strawberry\perl\bin\perl.exe"
          if (-not (Test-Path $perl)) { choco install strawberryperl --no-progress -y }
          "OPENSSL_SRC_PERL=$perl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm tauri build --target ${{ matrix.target }}

      # After the build, which fetches slskd and builds the frontend: the app
      # doesn't compile without them.
      - name: Test
        if: matrix.test
        working-directory: src-tauri
        run: cargo test --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: jim-box-${{ matrix.target }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
